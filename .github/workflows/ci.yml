name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CONVEX_DEPLOYMENT: dev:marvelous-hound-269
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  VITE_CONVEX_URL: https://marvelous-hound-269.eu-west-1.convex.cloud

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upload installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules
          if-no-files-found: error

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  react-compiler:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: React Compiler check
        run: bun run react-compiler:check

  format:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex artifacts
        run: bun run codegen

      - name: Typecheck
        run: bun run typecheck

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex artifacts
        run: bun run codegen

      - name: Test
        run: bun run test

  build:
    needs: [prepare, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules

      - name: Reinstall dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex artifacts
        run: bun run codegen

      - name: Build
        run: bun run build
