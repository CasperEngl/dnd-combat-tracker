name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upload installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: bun-dependencies
          path: node_modules
          if-no-files-found: error

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: .

      - name: Lint
        run: bun run lint

  react-compiler:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: .

      - name: React Compiler check
        run: bun run react-compiler:check

  format:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: .

      - name: Format check
        run: bun run format:check

  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download installed dependencies
        uses: actions/download-artifact@v4
        with:
          name: bun-dependencies
          path: .

      - name: Typecheck
        run: bun run typecheck
